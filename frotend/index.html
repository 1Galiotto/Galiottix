<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galiottix</title>
</head>
<body>
    <header>
        <img src="" alt="">
        <h1>Galiottix BET</h1>
        <nav>
            <a href="">Login</a>
<!-- ----------------------------------------- -->
            <a href="">Register</a>
        </nav>
    </header>
    <main>
        <div id="auth-container">
            <form action="" id="Register">
                <label for="nome">Digite seu nome: </label>
                <input type="text" id="nome" placeholder="Exemplo: Kylian Mbappé"><br>
                
                <label for="endereco">Digite seu endereço: </label> <!-- Arrumar com metodologia certa e API de busca de endereço -->
                <input type="text" id="endereco" placeholder="Exemplo: Rua das alameidas N° 209"><br> <!-- Arrumar com metodologia certa e API de busca de endereço -->

                <label for="cpf">Digite seu CPF: </label>
                <input type="number" id="cpf" placeholder="Exemplo: 123456789012 "><br>

                

            </form>
            <form action="" id="Login">
                <label for="email">Digite seu email</label>
                <input type="text" id="email" placeholder="nomedoemail@dominio.com">
            </form>

        </div>
    </main>
    <footer>
        <div class="sobre" id="sobre">
        
        </div>
    </footer>
</body>
</html>
